<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin | Lume</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="cuerpo-login">
    <main class="tarjeta-login">
        <h1>Lume</h1>
        <p>Panel de Administración</p>

        <div id="login-error-alert" style="display:none; background:#ffebee; color:#c62828; padding:10px; border-radius:8px; margin-bottom:15px; font-size:13px;"></div>

        <form id="lume-login-form">
            <div class="campo-login">
                <label for="login-email">Correo Electrónico:</label>
                <input type="email" id="login-email" placeholder="admin@lume.com" required>
            </div>

            <div class="campo-login">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Ingresar al Panel</button>
        </form>

        <div class="datos-demo">
            <b>Datos de acceso:</b><br>
            Correo: <code>admin@lume.com</code><br>
            Clave: <code>lume123</code>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: #8c4843; text-decoration: none; font-size: 13px;">← Volver a la tienda</a>
        </div>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
