<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | Lume Joyas & Pulseras</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="lume-login-body">
    <main class="login-card">
        <div class="login-brand-header">
            <h1>Lume</h1>
            <p>Acceso al Panel Privado de Administración</p>
        </div>

        <div id="login-error-alert" class="login-error-alert"></div>

        <form id="lume-login-form">
            <div class="login-form-group">
                <label for="login-email">Correo Electrónico:</label>
                <input type="email" id="login-email" class="login-input" placeholder="admin@lume.com" required autocomplete="email">
            </div>

            <div class="login-form-group">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password" class="login-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="login-options-row">
                <label>
                    <input type="checkbox" id="login-remember"> Recordar sesión
                </label>
                <a href="index.html" class="btn-back-store">← Volver a la tienda</a>
            </div>

            <button type="submit" class="btn-login-submit">
                <span>Ingresar al Panel</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 17l5-5-5-5v10z"/>
                </svg>
            </button>
        </form>

        <div class="login-demo-credentials">
            <strong>Credenciales de acceso:</strong><br>
            Correo: <code>admin@lume.com</code><br>
            Contraseña: <code>lume123</code>
        </div>

        <div class="login-footer-links">
            <p>© Lumegn • Emprendimiento de María González y Ángeles Navas</p>
        </div>
    </main>

    <!-- Scripts del Sistema -->
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
