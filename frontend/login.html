<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro | Lume</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="cuerpo-login">
    <main class="tarjeta-login">
        <div style="text-align: center; margin-bottom: 15px;">
            <span style="font-size: 32px;">🔒</span>
        </div>
        <h1>Lume</h1>
        <p>Portal Privado de Administración</p>

        <!-- Mensajes de alerta o bloqueo por seguridad -->
        <div id="login-error-alert" style="display:none; background:#ffebee; color:#c62828; padding:12px; border-radius:8px; margin-bottom:15px; font-size:13px; border: 1px solid #ffcdd2;"></div>

        <form id="lume-login-form">
            <div class="campo-login">
                <label for="login-email">Correo Electrónico:</label>
                <input type="email" id="login-email" placeholder="usuario@lume.com" required autocomplete="username">
            </div>

            <div class="campo-login">
                <label for="login-password">Contraseña:</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" style="width: 100%; padding-right: 40px;">
                    <button type="button" id="btn-toggle-password" onclick="toggleMostrarClave()" style="position: absolute; right: 10px; background: transparent; border: none; cursor: pointer; font-size: 16px; color: #7d6b63;" aria-label="Mostrar u ocultar contraseña">👁</button>
                </div>
            </div>

            <button type="submit" id="btn-login-submit" class="btn-login">Ingresar de Forma Segura</button>
        </form>

        <div style="text-align: center; margin-top: 25px; font-size: 13px;">
            <a href="index.html" style="color: #8c4843; text-decoration: none; font-weight: 500;">← Volver a la tienda principal</a>
        </div>
    </main>

    <script src="js/admin.js"></script>
    <script>
        // Función para mostrar u ocultar la contraseña
        function toggleMostrarClave() {
            const inputClave = document.getElementById('login-password');
            const boton = document.getElementById('btn-toggle-password');
            if (inputClave.type === 'password') {
                inputClave.type = 'text';
                boton.textContent = '🔒';
            } else {
                inputClave.type = 'password';
                boton.textContent = '👁';
            }
        }
    </script>
</body>
</html>
