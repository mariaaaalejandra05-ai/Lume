<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Lume</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- Barra superior -->
    <header class="navbar-admin">
        <h2>Lume Admin</h2>
        <div class="acciones-nav-admin">
            <span style="font-size: 13px; color: #5c4d4d;">María González & Ángeles Navas</span>
            <a href="index.html" class="btn-volver-tienda">Ver Tienda</a>
            <button type="button" class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </header>

    <main class="contenedor-admin">
        <!-- Métricas básicas -->
        <div class="grid-stats">
            <div class="tarjeta-stat">
                <h3 id="stat-total-products">0</h3>
                <p>Piezas en Catálogo</p>
            </div>
            <div class="tarjeta-stat">
                <h3 id="stat-total-inquiries">0</h3>
                <p>Mensajes de Clientes</p>
            </div>
        </div>

        <!-- Pestañas -->
        <div class="tabs-admin">
            <button type="button" class="admin-tab-btn active" data-tab="products">Gestión de Catálogo</button>
            <button type="button" class="admin-tab-btn" data-tab="inquiries">Bandeja de Mensajes</button>
        </div>

        <!-- PESTAÑA 1: PRODUCTOS -->
        <section id="tab-products-section" style="border:none; padding:0; box-shadow:none; background:transparent;">
            <div class="barra-tabla-admin">
                <h3>Lista de Productos</h3>
                <button type="button" id="btn-open-create-product" class="btn-nuevo-prod">+ Nueva Pieza</button>
            </div>

            <div class="caja-tabla">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-table-body">
                        <!-- Llenado por admin.js -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- PESTAÑA 2: MENSAJES DE CONTACTO -->
        <section id="tab-inquiries-section" style="display: none; border:none; padding:0; box-shadow:none; background:transparent;">
            <h3>Mensajes Recibidos de Clientes</h3>
            <div id="admin-inquiries-list" style="margin-top: 15px;">
                <!-- Llenado por admin.js -->
            </div>
        </section>
    </main>

    <!-- Modal para Agregar o Editar Producto -->
    <div id="admin-product-modal" class="modal-fondo">
        <div class="modal-caja" style="max-width: 500px;">
            <button type="button" class="btn-cerrar-x" onclick="cerrarModalAdmin()">✕</button>
            <h3 id="modal-form-title" style="font-family:'Playfair Display', serif; color:#8c4843; margin-bottom: 15px;">Nueva Pieza</h3>
            
            <form id="admin-product-form">
                <div class="grupo-campo">
                    <label for="product-form-name">Nombre de la pulsera o joya:</label>
                    <input type="text" id="product-form-name" class="input-contacto" required placeholder="Ej. Pulsera Hilo Rojo">
                </div>

                <div class="fila-dos-campos">
                    <div class="grupo-campo">
                        <label for="product-form-category">Categoría:</label>
                        <select id="product-form-category" class="select-contacto" required>
                            <option value="pulseras">Pulseras</option>
                            <option value="joyas">Joyas</option>
                            <option value="parejas">Parejas</option>
                            <option value="personalizadas">Personalizadas</option>
                        </select>
                    </div>
                    <div class="grupo-campo">
                        <label for="product-form-price">Precio (COP):</label>
                        <input type="number" id="product-form-price" class="input-contacto" required min="1000" placeholder="18000">
                    </div>
                </div>

                <div class="grupo-campo">
                    <label for="product-form-stock">Cantidad en stock:</label>
                    <input type="number" id="product-form-stock" class="input-contacto" value="15" min="0">
                </div>

                <div class="grupo-campo">
                    <label for="product-form-materials">Materiales:</label>
                    <input type="text" id="product-form-materials" class="input-contacto" placeholder="Ej. Hilo encerado y acero inoxidable">
                </div>

                <div class="grupo-campo">
                    <label for="product-form-description">Descripción:</label>
                    <textarea id="product-form-description" class="textarea-contacto" rows="3" required placeholder="Descripción del accesorio..."></textarea>
                </div>

                <div class="grupo-campo">
                    <label for="product-form-image">URL de la Imagen:</label>
                    <input type="url" id="product-form-image" class="input-contacto" required placeholder="https://images.unsplash.com/...">
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                    <button type="button" class="btn-cerrar-modal" onclick="cerrarModalAdmin()">Cancelar</button>
                    <button type="submit" class="btn-nuevo-prod">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Administración -->
    <script src="js/admin.js"></script>
</body>
</html>
